# Configuration nginx du site vitrine (conteneur `indusiax-landing`).
#
# Ce fichier est monté en lecture seule depuis le VPS :
#   /docker/indusiax-landing/default.conf -> /etc/nginx/conf.d/default.conf
# Il vivait jusqu'ici uniquement sur le serveur. Le versionner ici évite qu'une
# correction serveur reste invisible du dépôt — c'est ce qui a laissé passer
# l'absence de charset pendant toute la vie du site.
#
# Déploiement :
#   scp deploy/default.conf root@76.13.138.23:/docker/indusiax-landing/default.conf
#   ssh root@76.13.138.23 "docker exec indusiax-landing nginx -t && docker restart indusiax-landing"

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Sans cette ligne, nginx renvoie « Content-Type: text/plain » nu pour
    # llms.txt et « text/xml » nu pour sitemap.xml : un client qui ne devine
    # pas l'encodage les lit en Latin-1 et n'y trouve que du mojibake
    # (« Indusiax Ã©dite », « 650 â‚¬ »). Les pages HTML s'en sortaient grâce à
    # leur <meta charset>, les fichiers texte n'ont pas ce filet.
    # charset_types par défaut : text/html (toujours), text/xml, text/plain,
    # text/vnd.wap.wml, application/javascript, application/rss+xml — la liste
    # est étendue ci-dessous au JSON (site.webmanifest / données structurées).
    charset utf-8;
    charset_types text/xml text/plain text/vnd.wap.wml text/css
                  application/javascript application/rss+xml application/json
                  image/svg+xml;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page 404 /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
        internal;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
