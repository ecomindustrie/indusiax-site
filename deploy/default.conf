# Configuration nginx du site vitrine (conteneur `indusiax-landing`).
#
# Ce fichier est monté en lecture seule depuis le VPS :
#   /docker/indusiax-landing/default.conf -> /etc/nginx/conf.d/default.conf
# Il vivait jusqu'ici uniquement sur le serveur. Le versionner ici évite qu'une
# correction serveur reste invisible du dépôt — c'est ce qui a laissé passer
# l'absence de charset pendant toute la vie du site.
#
# Déploiement :
#   scp deploy/default.conf root@76.13.138.23:/docker/indusiax-landing/default.conf
#   ssh root@76.13.138.23 "docker exec indusiax-landing nginx -t && docker restart indusiax-landing"

# --- Redirection automatique par langue (14/10/2026) ------------------------
# Un visiteur qui arrive sur une page FRANÇAISE est renvoyé (302) vers la même
# page en anglais ou en néerlandais selon la PREMIÈRE langue de son navigateur :
#   nl*            -> /nl/…   (Pays-Bas et Flandre)
#   fr*            -> reste en français
#   toute autre    -> /en/…   (de, es, it, en…)
#   en-tête absent -> reste en français (robots, outils)
# Le choix explicite du visiteur dans le sélecteur FR · EN · NL (cookie « lang »,
# posé par site.js) passe AVANT l'en-tête. Les robots ne sont jamais redirigés :
# Google doit pouvoir indexer chaque langue à son adresse, reliées par hreflang.
# Les pages /en/ et /nl/ ne redirigent jamais.

# Les clés de la table de redirection (« en:/blog/<slug-long>/ ») dépassent la
# taille de case par défaut (64) : sans cette ligne, nginx refuse de démarrer.
map_hash_bucket_size 256;

map $http_accept_language $i18n_entete {
    default    en;
    ""         fr;
    ~*^\s*fr   fr;
    ~*^\s*nl   nl;
}

map $cookie_lang $i18n_cookie {
    default    "";
    fr         fr;
    en         en;
    nl         nl;
}

map $http_user_agent $i18n_robot {
    default    0;
    ""         1;
    ~*(bot|crawl|spider|slurp|archiver|facebookexternalhit|embedly|preview|whatsapp|telegram|lighthouse|pagespeed|headless|curl|wget|python|monitor|uptime) 1;
}

map "$i18n_cookie:$i18n_robot:$i18n_entete" $i18n_veut {
    ~^(?<l>fr|en|nl):  $l;
    ~^:1:              fr;
    ~^:0:(?<h>\w+)$    $h;
    default            fr;
}

# >>> i18n — bloc régénéré par outils/i18n_build.py, ne pas éditer à la main
