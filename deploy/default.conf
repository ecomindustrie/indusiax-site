# <<< i18n

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Sans cette ligne, nginx renvoie « Content-Type: text/plain » nu pour
    # llms.txt et « text/xml » nu pour sitemap.xml : un client qui ne devine
    # pas l'encodage les lit en Latin-1 et n'y trouve que du mojibake
    # (« Indusiax Ã©dite », « 650 â‚¬ »). Les pages HTML s'en sortaient grâce à
    # leur <meta charset>, les fichiers texte n'ont pas ce filet.
    # charset_types par défaut : text/html (toujours), text/xml, text/plain,
    # text/vnd.wap.wml, application/javascript, application/rss+xml — la liste
    # est étendue ci-dessous au JSON (site.webmanifest / données structurées).
    # nginx tourne en HTTP derrière Traefik : une redirection absolue partirait
    # en « http://indusiax.com/nl/ », un détour par HTTP avant le retour en
    # HTTPS. Relative, elle garde le schéma et l'hôte du visiteur.
    absolute_redirect off;

    charset utf-8;
    charset_types text/xml text/plain text/vnd.wap.wml text/css
                  application/javascript application/rss+xml application/json
                  image/svg+xml;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # La réponse d'une page FR dépend de la langue et du cookie : un cache
        # intermédiaire ne doit pas servir à un Néerlandais la page d'un Français.
        add_header Vary "Accept-Language, Cookie" always;
        if ($i18n_cible != "") {
            return 302 $i18n_cible$is_args$args;
        }
    }

    location /en/ {
        root   /usr/share/nginx/html;
        index  index.html;
        error_page 404 /en/404.html;
    }

    location /nl/ {
        root   /usr/share/nginx/html;
        index  index.html;
        error_page 404 /nl/404.html;
    }

    location = /en/404.html { root /usr/share/nginx/html; internal; }
    location = /nl/404.html { root /usr/share/nginx/html; internal; }

    error_page 404 /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
        internal;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
